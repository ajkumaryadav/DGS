# ==============================================================================
# District Governance Suite (DGS) - Official NGINX Gateway Configuration
# Serves DGS Launcher on Port 80 and Gateway Redirects All District Web Apps
# ==============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen       80;
        server_name  localhost 10.70.12.73;

        # ----------------------------------------------------------------------
        # 1. DGS Launcher Root (Static Application Portal)
        # ----------------------------------------------------------------------
        location / {
            root   d:/aj/dgs;
            index  index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ----------------------------------------------------------------------
        # 2. ACCC - District Camera Monitoring System (Port 3000)
        # ----------------------------------------------------------------------
        location /accc/ {
            return 302 http://$host:3000/;
        }
        location = /accc {
            return 302 http://$host:3000/;
        }

        # ----------------------------------------------------------------------
        # 3. ECMS - Election Counting Management System (Port 3001)
        # ----------------------------------------------------------------------
        location /ecms/ {
            return 302 http://$host:3001/;
        }
        location = /ecms {
            return 302 http://$host:3001/;
        }

        # ----------------------------------------------------------------------
        # 4. Flagship Scheme Monitoring (Port 8080)
        # ----------------------------------------------------------------------
        location /flagship/ {
            return 302 http://$host:8080/;
        }
        location = /flagship {
            return 302 http://$host:8080/;
        }

        # ----------------------------------------------------------------------
        # 5. Dak Monitoring System (Port 3050)
        # ----------------------------------------------------------------------
        location /dak/ {
            return 302 http://$host:3050/;
        }
        location = /dak {
            return 302 http://$host:3050/;
        }

        # ----------------------------------------------------------------------
        # 6. Office Record Management (Port 3005)
        # ----------------------------------------------------------------------
        location /records/ {
            return 302 http://$host:3005/;
        }
        location = /records {
            return 302 http://$host:3005/;
        }

        # ----------------------------------------------------------------------
        # 7. Budget Announcement Monitoring System - BAMS (Port 3100)
        # ----------------------------------------------------------------------
        location /bams/ {
            return 302 http://$host:3100/;
        }
        location = /bams {
            return 302 http://$host:3100/;
        }
        location /bms/ {
            return 302 http://$host:3100/;
        }
        location = /bms {
            return 302 http://$host:3100/;
        }

        # ----------------------------------------------------------------------
        # 8. EMS - Employees Management System (Port 3333)
        # ----------------------------------------------------------------------
        location /ems/ {
            return 302 http://$host:3333/;
        }
        location = /ems {
            return 302 http://$host:3333/;
        }

        # ----------------------------------------------------------------------
        # 9. Sampark Application (Port 7000)
        # ----------------------------------------------------------------------
        location /sampark/ {
            return 302 http://$host:7000/;
        }
        location = /sampark {
            return 302 http://$host:7000/;
        }

        # Custom Error Pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
