<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="budgetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadowBudget" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#budgetGrad)" filter="url(#shadowBudget)"/>
  <!-- Financial Budget / Rupee Ledger & Growth Chart -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wallet / Vault Ledger Frame -->
    <rect x="28" y="32" width="72" height="64" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Currency / Rupee Symbol -->
    <path d="M44 48 L64 48" stroke="#ffffff" stroke-width="4"/>
    <path d="M44 56 L60 56" stroke="#ffffff" stroke-width="4"/>
    <path d="M50 48 C60 48, 62 62, 50 64 L66 80" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Budget Tally Coins / Bars on right -->
    <rect x="74" y="62" width="8" height="22" rx="2" fill="#34d399" stroke="none"/>
    <rect x="86" y="48" width="8" height="36" rx="2" fill="#6ee7b7" stroke="none"/>
    
    <!-- Financial Growth Arc -->
    <path d="M72 44 L88 32 L94 40" stroke="#fde047" stroke-width="3.5"/>
  </g>
</svg>