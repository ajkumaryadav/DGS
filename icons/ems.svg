<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="emsHrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadowEmsHr" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#emsHrGrad)" filter="url(#shadowEmsHr)"/>
  <!-- Employee ID Badge & Team -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lanyard Clip -->
    <rect x="56" y="16" width="16" height="8" rx="2" fill="#ffffff" fill-opacity="0.8"/>
    <path d="M64 24 L64 30"/>
    
    <!-- ID Card Body -->
    <rect x="32" y="30" width="64" height="76" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Profile Avatar inside badge -->
    <circle cx="64" cy="52" r="11" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
    <path d="M48 74 C48 66, 55 64, 64 64 C73 64, 80 66, 80 74" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
    
    <!-- Employee Info Lines -->
    <line x1="44" y1="84" x2="84" y2="84" stroke="#ffffff" stroke-width="4"/>
    <line x1="50" y1="94" x2="78" y2="94" stroke="#c4b5fd" stroke-width="3"/>
  </g>
</svg>