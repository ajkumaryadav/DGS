<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="elecPowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadowElecPow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#elecPowGrad)" filter="url(#shadowElecPow)"/>
  <!-- Lightning Bolt & Transmission Tower / Energy -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lightning Flash -->
    <polygon points="68,24 38,68 62,68 56,104 90,56 66,56" fill="#fef08a" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
