<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="dakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadowDak" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#dakGrad)" filter="url(#shadowDak)"/>
  <!-- Dak / Mail Envelope & Dispatch Tracking -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Envelope Body -->
    <rect x="26" y="36" width="76" height="56" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="4"/>
    <!-- Flap fold -->
    <path d="M28 40 L64 68 L100 40"/>
    <!-- Official Stamp Mark -->
    <rect x="76" y="44" width="18" height="22" rx="3" stroke="#fde047" stroke-width="3" fill="#fde047" fill-opacity="0.2"/>
    <circle cx="85" cy="55" r="4" fill="#fde047" stroke="none"/>
    <!-- Dispatch Speed lines / Tracking check -->
    <path d="M40 76 L52 76" stroke="#bae6fd" stroke-width="4"/>
    <path d="M40 84 L60 84" stroke="#bae6fd" stroke-width="4"/>
    <!-- Circular Tracking Badge -->
    <circle cx="94" cy="90" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
    <path d="M88 90 L92 94 L100 86" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>