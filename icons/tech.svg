<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="shadowTech" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#techGrad)" filter="url(#shadowTech)"/>
  <!-- Code Terminal / Chip / Microprocessor -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Terminal Screen Window -->
    <rect x="28" y="32" width="72" height="64" rx="8" fill="#ffffff" fill-opacity="0.12"/>
    <line x1="28" y1="46" x2="100" y2="46"/>
    <!-- Terminal Dots -->
    <circle cx="38" cy="39" r="2.5" fill="#f43f5e" stroke="none"/>
    <circle cx="46" cy="39" r="2.5" fill="#fbbf24" stroke="none"/>
    <circle cx="54" cy="39" r="2.5" fill="#34d399" stroke="none"/>
    <!-- Code Brackets & Prompt -->
    <path d="M42 62 L52 70 L42 78" stroke="#a78bfa" stroke-width="4"/>
    <line x1="58" y1="78" x2="72" y2="78" stroke="#ffffff" stroke-width="4"/>
    <path d="M86 58 L78 68 L86 78" stroke="#c4b5fd" stroke-width="3"/>
  </g>
</svg>
