<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadowNet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#netGrad)" filter="url(#shadowNet)"/>
  <!-- Network Topology Nodes & Switch Router -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Server / Central Hub -->
    <rect x="42" y="24" width="44" height="26" rx="6" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="3.5"/>
    <circle cx="52" cy="37" r="2.5" fill="#34d399"/>
    <circle cx="62" cy="37" r="2.5" fill="#34d399"/>
    <circle cx="74" cy="37" r="2.5" fill="#60a5fa"/>

    <!-- Connecting Bus Lines -->
    <line x1="64" y1="50" x2="64" y2="68" stroke="#ffffff" stroke-width="4"/>
    <line x1="28" y1="68" x2="100" y2="68" stroke="#ffffff" stroke-width="4"/>
    
    <line x1="32" y1="68" x2="32" y2="82" stroke="#ffffff" stroke-width="3.5"/>
    <line x1="64" y1="68" x2="64" y2="82" stroke="#ffffff" stroke-width="3.5"/>
    <line x1="96" y1="68" x2="96" y2="82" stroke="#ffffff" stroke-width="3.5"/>

    <!-- Client Nodes -->
    <rect x="20" y="82" width="24" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#ffffff" stroke-width="2"/>
    <rect x="52" y="82" width="24" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#ffffff" stroke-width="2"/>
    <rect x="84" y="82" width="24" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Activity Dots in Nodes -->
    <circle cx="32" cy="92" r="2" fill="#0891b2"/>
    <circle cx="64" cy="92" r="2" fill="#0891b2"/>
    <circle cx="96" cy="92" r="2" fill="#0891b2"/>
  </g>
</svg>