<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="elecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadowElec" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#elecGrad)" filter="url(#shadowElec)"/>
  <!-- Ballot Box & Vote -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ballot Box -->
    <rect x="28" y="46" width="72" height="56" rx="8" fill="#ffffff" fill-opacity="0.12"/>
    <line x1="28" y1="62" x2="100" y2="62"/>
    <!-- Slot -->
    <rect x="44" y="52" width="40" height="4" rx="2" fill="#ffffff"/>
    <!-- Ballot Paper with Checkmark -->
    <path d="M48 24 L80 24 L80 50 L48 50 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3"/>
    <path d="M56 36 L62 42 L72 32" stroke="#059669" stroke-width="4" fill="none"/>
  </g>
</svg>
